<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genius Multiplayer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Jogo <span>Genius</span></h1>

<div class="container">

  <!-- TABULEIRO -->

  <div class="game-board">

    <div class="color green botao" data-cor="green"></div>

    <div class="color red botao" data-cor="red"></div>

    <div class="color yellow botao" data-cor="yellow"></div>

    <div class="color blue botao" data-cor="blue"></div>

    <!-- CENTRO -->

  </div>

  <!-- PAINEL -->

  <div class="panel">

    <!-- PLACAR -->

    <div class="card">

      <h3>PLACAR</h3>

      <div class="infos">

        <div>
          <p>RODADA</p>
          <span id="round">0</span>
        </div>

        <div>
          <p>PONTOS</p>
          <span id="score">0 x 0</span>
        </div>

        <div>
          <p>RECORDE</p>
          <span id="highScore">0</span>
        </div>

      </div>

    </div>

    <!-- MENSAGEM -->

    <div class="card">

      <h3>MENSAGEM</h3>

      <div class="message" id="message">

        Clique em iniciar para jogar!

      </div>

    </div>

    <!-- BOTÕES -->

    <div class="card">

      <h3>CONTROLES</h3>

      <div class="buttons">

        <button id="startBtn">
          Iniciar
        </button>

        <button id="restartBtn">
          Reiniciar
        </button>

      </div>

    </div>

  </div>

</div>
<!-- PAINEL NOMES -->

<div class="name-panel" id="namePanel">

  <div class="name-box">

    <h2>Jogadores</h2>

    <input
      type="text"
      id="player1"
      placeholder="Nome do Jogador 1"
    >

    <input
      type="text"
      id="player2"
      placeholder="Nome do Jogador 2"
    >

    <button id="playBtn">
      COMEÇAR
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
