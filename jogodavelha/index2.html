<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- TELA INICIAL -->
    <div id="inicio">

        <div class="cardInicio">

            <h1>Jogo da Velha</h1>

            <p>
                Digite o nome dos jogadores
            </p>

            <input type="text"
                   id="nome1"
                   placeholder="Nome do Jogador X">

            <input type="text"
                   id="nome2"
                   placeholder="Nome do Jogador O">

            <button onclick="comecarJogo()">

                Começar Jogo

            </button>

        </div>

    </div>

    <!-- JOGO -->
    <div id="jogo"
         style="display:none;">

        <header>

            <h1>Jogo da Velha</h1>

            <p class="subtitulo"
               id="vezJogador">

               Vez do Jogador X

            </p>

        </header>

        <main>

            <!-- PLACAR -->
            <div class="scores">

                <div class="score">

                    <h3 id="jogador1Nome">
                        Jogador X
                    </h3>

                    <p id="scoreX">0</p>

                </div>

                <div class="score">

                    <h3 id="jogador2Nome">
                        Jogador O
                    </h3>

                    <p id="scoreO">0</p>

                </div>

            </div>

            <!-- TABULEIRO -->
            <div class="tabuleiro">

                <button class="casa"
                        onclick="jogar(this,0)">
                </button>

                <button class="casa"
                        onclick="jogar(this,1)">
                </button>

                <button class="casa"
                        onclick="jogar(this,2)">
                </button>

                <button class="casa"
                        onclick="jogar(this,3)">
                </button>

                <button class="casa"
                        onclick="jogar(this,4)">
                </button>

                <button class="casa"
                        onclick="jogar(this,5)">
                </button>

                <button class="casa"
                        onclick="jogar(this,6)">
                </button>

                <button class="casa"
                        onclick="jogar(this,7)">
                </button>

                <button class="casa"
                        onclick="jogar(this,8)">
                </button>

            </div>

            <!-- MENSAGEM -->
            <div class="mensagem">

                <p id="mensagem">
                    Clique em começar
                </p>

            </div>

            <!-- BOTÃO -->
            <button class="reset"
                    onclick="reiniciar()">

                Reiniciar

            </button>

        </main>

    </div>

    <script src="index.js"></script>

</body>

</html>
