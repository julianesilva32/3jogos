<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- CONFIGURAÇÕES -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- TÍTULO -->
    <title>Pedra, Papel e Tesoura</title>

</head>

<body>

    <!-- TELA INICIAL -->
    <div id="inicio">

        <div class="cardInicio">

            <h1>Pedra, Papel e Tesoura</h1>

            <p>
                Digite o nome dos jogadores
            </p>

            <!-- INPUT JOGADOR 1 -->
            <input type="text"
                   id="nome1"
                   placeholder="Nome do Jogador 1">

            <!-- INPUT JOGADOR 2 -->
            <input type="text"
                   id="nome2"
                   placeholder="Nome do Jogador 2">

            <!-- BOTÃO -->
            <button onclick="comecarJogo()">

                Começar Jogo

            </button>

        </div>

    </div>

    <!-- JOGO -->
    <div id="jogo"
         style="display: none;">

        <!-- HEADER -->
        <header>

            <h1>Pedra, Papel e Tesoura</h1>

            <p class="subtitulo"
               id="vezJogador">

                Vez do Jogador 1

            </p>

        </header>

        <!-- MAIN -->
        <main>

            <!-- BOTÕES -->
            <div class="game">

                <!-- PEDRA -->
                <button class="card"
                        onclick="jogar('pedra')">

                    <img src="./pedra2.png"
                         alt="Pedra">

                    <h2>Pedra</h2>

                </button>

                <!-- PAPEL -->
                <button class="card"
                        onclick="jogar('papel')">

                    <img src="./papel2.png"
                         alt="Papel">

                    <h2>Papel</h2>

                </button>

                <!-- TESOURA -->
                <button class="card"
                        onclick="jogar('tesoura')">

                    <img src="./tesoura2.png"
                         alt="Tesoura">

                    <h2>Tesoura</h2>

                </button>

            </div>

            <!-- PLACAR -->
            <div class="scores">

                <!-- JOGADOR 1 -->
                <div class="score">

                    <h3 id="jogador1Nome">
                        Jogador 1
                    </h3>

                    <p id="score1">
                        0
                    </p>

                </div>

                <!-- JOGADOR 2 -->
                <div class="score">

                    <h3 id="jogador2Nome">
                        Jogador 2
                    </h3>

                    <p id="score2">
                        0
                    </p>

                </div>

            </div>

            <!-- RESULTADO -->
            <div class="resultado">

                <!-- JOGADOR 1 -->
                <div class="escolha">

                    <h3 id="nomeResultado1">
                        Jogador 1
                    </h3>

                    <img id="img1"
                         src="./player2.png"
                         alt="Jogador 1">

                </div>

                <h1>X</h1>

                <!-- JOGADOR 2 -->
                <div class="escolha">

                    <h3 id="nomeResultado2">
                        Jogador 2
                    </h3>

                    <img id="img2"
                         src="./player2.png"
                         alt="Jogador 2">

                </div>

            </div>

            <!-- MENSAGEM -->
            <div class="mensagem">

                <p id="mensagem">

                    Clique em começar

                </p>

            </div>

            <!-- BOTÃO RESET -->
            <button class="reset"
                    onclick="reiniciar()">

                Reiniciar

            </button>

        </main>

    </div>

    <!-- JAVASCRIPT -->
    <script src="index.js"></script>

</body>

</html>
